[build]
  command = "npm run build"
  publish = "dist"

[dev]
  command = "npm run dev:proxy"
  targetPort = 5173

[[redirects]]
  from = "/api/sheets"
  to = "/.netlify/functions/sheets-proxy"
  status = 200

[[redirects]]
  from = "/api/integration/health"
  to = "/.netlify/functions/integration-health"
  status = 200

[[redirects]]
  from = "/api/admin/login"
  to = "/.netlify/functions/admin-login"
  status = 200

[[redirects]]
  from = "/api/admin/logout"
  to = "/.netlify/functions/admin-logout"
  status = 200

[[redirects]]
  from = "/api/admin/session"
  to = "/.netlify/functions/admin-session"
  status = 200

[[redirects]]
  from = "/api/admin/integration-health"
  to = "/.netlify/functions/admin-integration-health"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers (all routes) ─────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

    # Content Security Policy
    # Allows:
    #   default-src 'self'            — same-origin for scripts, workers, frames
    #   script-src  'self'            — JS only from same origin (Vite bundles)
    #   style-src   'self' 'unsafe-inline' https://fonts.googleapis.com
    #                                 — 'unsafe-inline' needed because Vite injects
    #                                   critical CSS as <style> tags at build time
    #   img-src     'self' data: blob: https:
    #                                 — images from same origin, data URIs, and HTTPS
    #   font-src    'self' https://fonts.gstatic.com
    #                                 — Google Fonts (DM Sans, DM Serif, Amiri)
    #   connect-src 'self' https://api.aladhan.com
    #                                 — same-origin integrations + prayer time API
    #   frame-src   'self' https://www.youtube-nocookie.com https://www.youtube.com
    #                                 — YouTube Live & Video Embeds
    #   object-src  'none'            — no plugins
    #   form-action 'self'            — form submissions only to same origin
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.aladhan.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; form-action 'self';"

# ── Long-lived cache for hashed assets (Vite fingerprints all bundles) ─────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
